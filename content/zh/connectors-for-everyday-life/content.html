<div class="u-rich-text-blog u-margin-trim w-richtext"><p>Claude 新增了一系列连接器，让你可以连接到日常使用的应用和服务，包括 Google 日历、Gmail、Slack、Notion 等。这些连接器让 Claude 能够直接在你的工作流中发挥作用。</p><h2>可用连接器</h2><ul><li><strong>Google 日历</strong>：管理日程、创建事件、查看安排</li><li><strong>Gmail</strong>：阅读和发送邮件、管理收件箱</li><li><strong>Slack</strong>：发送消息、搜索频道历史</li><li><strong>Notion</strong>：创建和编辑文档、管理数据库</li><li><strong>更多</strong>：持续增加新的连接器</li></ul><h2>开始使用</h2><p>连接器功能在 Claude 的设置中即可启用。连接你的账户后，Claude 就可以在对话中直接调用这些服务。</p></div>
